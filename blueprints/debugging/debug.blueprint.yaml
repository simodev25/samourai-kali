schema_version: 1
kind: debugging
name: debug
description: "Generation contract for a vulnerability investigation report."
inputs:
  required:
    - finding
    - reproduction_evidence
    - observed_evidence
  optional:
    - environment
    - suspected_area
outputs:
  primary:
    - ".samourai/tmpai/debugging/investigation-report.md"
safety:
  secrets_policy: "Mask any observed secret; never copy it."
  external_actions: "Do not call external services without approval."
  destructive_actions: "Do not delete caches, data, or branches without confirmation."
tools_allowed:
  - read
  - search
  - shell_readonly
validation:
  - "Vulnerability root cause is separated from exploitation hypotheses."
  - "Reproduction evidence and commands are listed."
