version: 1
policy: review

objectives:
  - validate_finding_accuracy
  - ensure_safe_reproducibility
  - verify_evidence_integrity
  - confirm_risk_scoring_correctness
  - enforce_report_completeness

severity:
  major:
    meaning: "Bloque la validation de la vulnérabilité"
    examples:
      - incorrect_or_unverifiable_finding
      - unsafe_poc_or_uncontrolled_exploitation_step
      - evidence_chain_of_custody_broken
      - critical_cvss_or_epss_error
  minor:
    meaning: "Doit être traité avant publication si impact sur la qualité du dossier"
    examples:
      - incomplete_reproduction_steps
      - partial_evidence_metadata
      - unclear_scope_or_preconditions
  nit:
    meaning: "Amélioration non bloquante"
    examples:
      - wording_or_formatting_cleanup
      - small_reference_gap

required_checks:
  - finding_accuracy
  - poc_safety
  - evidence_integrity
  - cvss_epss_correctness
  - report_completeness

exit_criteria:
  pass:
    - no_open_major
    - required_checks_complete
  conditional_pass:
    - only_nit_remaining
    - explicit_followup_recorded
  fail:
    - any_major_open
    - missing_verification_evidence
