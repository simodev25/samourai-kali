version: 1
policy: agent-permissions

principles:
  - least-privilege
  - explicit-delegation
  - traceable-side-effects

agents:
  pm:
    may_write:
      - ".samourai/docai/changes/**/chg-*-pm-notes.yaml"
    may_execute_commands: false
    may_commit: false
    may_open_pr: false
    may_delegate_to:
      - spec-writer
      - test-plan-writer
      - plan-writer
      - coder
      - reviewer
      - runner
      - fixer
      - doc-syncer
      - committer
      - pr-manager
      - attack-surface
      - bug-hunting
      - vulnerability-analysis
      - cve-intelligence
      - exploitability
      - safe-poc
      - evidence
      - cve-report
      - remediation

  spec-writer:
    may_write:
      - ".samourai/docai/changes/**/chg-*-spec.md"
    may_execute_commands: false
    may_commit: false

  test-plan-writer:
    may_write:
      - ".samourai/docai/changes/**/chg-*-test-plan.md"
    may_execute_commands: false
    may_commit: false

  plan-writer:
    may_write:
      - ".samourai/docai/changes/**/chg-*-plan.md"
    may_execute_commands: false
    may_commit: false

  coder:
    may_write:
      - "**"
    may_execute_commands: true
    may_commit: false

  reviewer:
    may_write:
      - ".samourai/docai/changes/**/chg-*-plan.md"
      - ".samourai/docai/changes/**/code-review/**"
    may_execute_commands: true
    may_commit: false

  runner:
    may_write:
      - ".samourai/tmpai/**"
    may_execute_commands: true
    may_commit: false

  fixer:
    may_write:
      - "**"
    may_execute_commands: true
    may_commit: false

  doc-syncer:
    may_write:
      - ".samourai/docai/spec/**"
      - ".samourai/docai/contracts/**"
      - ".samourai/docai/domain/**"
      - ".samourai/docai/quality/**"
      - ".samourai/docai/ops/**"
      - ".samourai/docai/guides/**"
    may_execute_commands: false
    may_commit: false

  committer:
    may_write:
      - "**"
    may_execute_commands: true
    may_commit: true

  pr-manager:
    may_write:
      - ".samourai/tmpai/pr/**"
    may_execute_commands: true
    may_commit: false
    may_open_pr: true

  attack-surface:
    may_write:
      - ".samourai/docai/changes/**/chg-*-recon.*"
    may_execute_commands: true
    may_commit: false

  bug-hunting:
    may_write:
      - ".samourai/docai/changes/**/chg-*-findings.*"
    may_execute_commands: true
    may_commit: false

  vulnerability-analysis:
    may_write:
      - ".samourai/docai/changes/**/chg-*-analysis.*"
    may_execute_commands: true
    may_commit: false

  cve-intelligence:
    may_write:
      - ".samourai/docai/changes/**/chg-*-cve-intel.*"
    may_execute_commands: false
    may_commit: false

  exploitability:
    may_write:
      - ".samourai/docai/changes/**/chg-*-exploitability.*"
    may_execute_commands: false
    may_commit: false

  safe-poc:
    may_write:
      - "**"
    may_execute_commands: true # lab-only
    may_commit: false

  evidence:
    may_write:
      - "evidence/**"
      - ".samourai/docai/changes/**/evidence-*"
    may_execute_commands: true # hashing, timestamping
    may_commit: false

  cve-report:
    may_write:
      - ".samourai/docai/changes/**/chg-*-report.*"
    may_execute_commands: false
    may_commit: false

  remediation:
    may_write:
      - "**"
    may_execute_commands: true # lab testing
    may_commit: false
